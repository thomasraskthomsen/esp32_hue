[workspace]
default-members = ["crates/tdongle"]
members         = ["crates/hue-ble", "crates/tdongle"]
resolver        = "3"

[workspace.package]
edition      = "2024"
license      = "MIT"
rust-version = "1.88"
version      = "0.1.0"

[workspace.dependencies]
embassy-futures = "0.1"
embassy-sync    = "0.8"
embassy-time    = { version = "0.5.1", features = ["log"] }
heapless        = "0.9"
log             = "0.4.27"
static_cell     = "2.1.1"

# BLE host stack and HCI types, on esp-radio's controller. 0.7 is the last
# trouble-host to use the same bt-hci as esp-radio.
bt-hci = { version = "0.9", default-features = false }
trouble-host = { version = "0.7", default-features = false, features = [
  "central",
  "default-packet-pool",
  "gatt",
  "log",
  "scan",
  "security",
] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
